<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penko Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/penguin-logo.svg">
    <link rel="apple-touch-icon" href="/penguin-logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Penko Reader">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Lora', 'Georgia', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
              dyslexic: ['OpenDyslexic', 'Comic Sans MS', 'sans-serif'],
            },
            colors: {
              primary: '#d97706', // pumpkin amber
              secondary: '#7a4e2e', // wood brown
              accent: '#f59e0b', // light amber
              surface: '#fdf5e2', // soft cream
              background: '#fff8e7', // honey cream
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fff8e7;
        color: #2b1e17;
      }
      
      .dark body {
        background-color: #1e1611;
        color: #f5eada;
      }

      /* Warm Amber Cabin card panels */
      .paper-card {
        background: #fdf5e2;
        border: 1px solid rgba(122, 78, 46, 0.15);
        box-shadow: 0 4px 20px rgba(122, 78, 46, 0.05);
      }

      .dark .paper-card {
        background: #291e17;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .oled-panel {
        background: #000000;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* Cozy Wooden Shelf Baseline decoration */
      .cozy-shelf {
        height: 12px;
        background: linear-gradient(to bottom, #7a4e2e, #5c381f);
        border-radius: 4px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      /* Custom focus ring for accessibility */
      .focus-ring:focus-visible {
        outline: 2px solid #b45309;
        outline-offset: 2px;
      }
      
      /* Cross-browser Range Slider Styling with Warm Sepia highlights */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      
      /* Webkit Thumb */
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #b45309; /* Warm Amber */
        cursor: pointer;
        margin-top: -6px; 
        box-shadow: 0 2px 6px rgba(120, 53, 15, 0.2);
        transition: transform 0.1s, background-color 0.1s;
      }
      input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
        background: #d97706;
      }
      
      /* Webkit Track */
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #e2e8f0; /* slate-200 for light mode */
        border-radius: 2px;
      }
      
      /* Dark mode overrides for Track */
      .dark input[type=range]::-webkit-slider-runnable-track {
        background: #27272a; /* zinc-800 for dark mode */
      }
      
      /* Hide scrollbar for text area but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
