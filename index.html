<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Penko Reader</title>
    <meta name="description" content="Penko Reader: an offline-first, privacy-respecting reading app with a cozy book reader, speed-reading trainer, and dictionary." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./penguin-logo.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Penko Reader">
    <meta name="theme-color" content="#FAF9F6">
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colors.
      try {
        var s = JSON.parse(localStorage.getItem('penko-settings') || '{}');
        var theme = s.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark' || theme === 'oled') document.documentElement.classList.add('dark');
        if (theme === 'oled') document.documentElement.classList.add('oled');
        var fs = Number(localStorage.getItem('penko-global-font-size') || '16');
        if (fs >= 14 && fs <= 24) document.documentElement.style.fontSize = fs + 'px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
